<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOMPETKU</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js untuk Grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Font Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #F2F2F7;
            --text-main: #000000;
            --text-muted: #6C6C70;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(60, 60, 67, 0.18);
            --input-bg: rgba(118, 118, 128, 0.08);
            --input-border: rgba(60, 60, 67, 0.15);
            --inner-box-bg: rgba(118, 118, 128, 0.05);
            --inner-box-border: rgba(60, 60, 67, 0.1);
        }

        html.dark {
            --bg-body: #000000;
            --text-main: #F8FAFC;
            --text-muted: #A1A1AA;
            --card-bg: #1E1E22;
            --card-border: rgba(255, 255, 255, 0.18);
            --input-bg: #2A2A2E;
            --input-border: rgba(255, 255, 255, 0.15);
            --inner-box-bg: #252529;
            --inner-box-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body) !important;
            color: var(--text-main) !important;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .ios-card {
            background-color: var(--card-bg) !important;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border) !important;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .ios-hero-card {
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
            border-radius: 1.5rem;
            box-shadow: 0 12px 30px rgba(0, 122, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .ios-input {
            background-color: var(--input-bg) !important;
            border: 1px solid var(--input-border) !important;
            color: var(--text-main) !important;
            border-radius: 0.75rem;
            transition: all 0.2s ease;
        }
        .ios-input:focus {
            border-color: #007AFF !important;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.25);
            outline: none;
        }

        .ios-inner-box {
            background-color: var(--inner-box-bg);
            border: 1px solid var(--inner-box-border);
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(142, 142, 147, 0.4);
            border-radius: 4px;
        }
    </style>
</head>
<body class="pb-12">

    <!-- Wrapper Utama -->
    <div class="max-w-5xl mx-auto px-4 sm:px-6 pt-8">

        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-[#007AFF] flex items-center justify-center text-white shadow-md shadow-blue-500/20 text-sm">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-tight">DOMPETKU</h1>
                    <p class="text-xs text-[var(--text-muted)]">Keuangan Bersama</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <!-- Status Koneksi Realtime -->
                <span id="sync-status" class="text-[10px] px-2.5 py-1 rounded-full font-bold bg-amber-500/10 text-amber-500 border border-amber-500/20 flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span> Menghubungkan...
                </span>
                <!-- Tombol Toggle Tema -->
                <button onclick="toggleDarkMode()" id="theme-toggle" class="w-10 h-10 rounded-2xl ios-card flex items-center justify-center text-sm text-[var(--text-main)] hover:opacity-80 transition cursor-pointer" title="Ubah Tema">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- Layout Utama -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- KOLOM KIRI -->
            <div class="space-y-6">
                <!-- Kartu Saldo -->
                <div class="ios-hero-card p-6 text-white relative overflow-hidden">
                    <div class="absolute -right-10 -bottom-10 w-36 h-36 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
                    <div class="mb-5 relative z-10">
                        <div class="flex justify-between items-center">
                            <p class="text-[11px] font-semibold uppercase tracking-wider text-blue-100">Total Saldo Bersama</p>
                            <span class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full font-bold">IDR</span>
                        </div>
                        <h2 id="total-saldo" class="text-3xl font-extrabold mt-1 tracking-tight">Rp 0</h2>
                    </div>
                    <div class="grid grid-cols-2 gap-2 pt-3 border-t border-white/20 relative z-10">
                        <div class="bg-black/15 backdrop-blur-md p-2.5 rounded-xl">
                            <span class="text-[10px] text-emerald-300 font-bold uppercase flex items-center gap-1"><i class="fa-solid fa-arrow-down"></i> Masuk</span>
                            <p id="total-pemasukan" class="text-xs font-bold mt-1">Rp 0</p>
                        </div>
                        <div class="bg-black/15 backdrop-blur-md p-2.5 rounded-xl">
                            <span class="text-[10px] text-rose-300 font-bold uppercase flex items-center gap-1"><i class="fa-solid fa-arrow-up"></i> Keluar</span>
                            <p id="total-pengeluaran" class="text-xs font-bold mt-1">Rp 0</p>
                        </div>
                    </div>
                </div>

                <!-- Form Input -->
                <section class="ios-card p-5">
                    <h3 class="font-bold text-xs mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-circle-plus text-[#007AFF]"></i> Catat Transaksi
                    </h3>
                    <div id="form-container"></div>
                </section>

                <!-- Budgeting 50/30/20 -->
                <section class="ios-card p-5 space-y-3.5">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-xs flex items-center gap-2">
                            <i class="fa-solid fa-chart-pie text-[#5856D6]"></i> Budgeting 50/30/20
                        </h3>
                    </div>
                    <div class="space-y-1">
                        <div class="flex justify-between text-[11px] font-semibold">
                            <span class="text-[var(--text-muted)]">50% Kebutuhan</span>
                            <span id="info-needs" class="text-[#007AFF]">Rp 0 / Rp 0</span>
                        </div>
                        <div class="w-full ios-inner-box h-2 rounded-full overflow-hidden">
                            <div id="bar-needs" class="bg-[#007AFF] h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <div class="flex justify-between text-[11px] font-semibold">
                            <span class="text-[var(--text-muted)]">30% Keinginan</span>
                            <span id="info-wants" class="text-[#5856D6]">Rp 0 / Rp 0</span>
                        </div>
                        <div class="w-full ios-inner-box h-2 rounded-full overflow-hidden">
                            <div id="bar-wants" class="bg-[#5856D6] h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="pt-2 border-t border-[var(--card-border)] flex justify-between items-center text-[11px] font-semibold">
                        <span class="text-[var(--text-muted)]">20% Tabungan (Savings)</span>
                        <span id="info-savings" class="text-[#34C759] font-bold">Rp 0</span>
                    </div>
                </section>
            </div>

            <!-- KOLOM KANAN -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Grafik -->
                <section class="ios-card p-5">
                    <h3 class="font-bold text-xs mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-chart-line text-[#34C759]"></i> Analisis Pengeluaran
                    </h3>
                    <div class="relative w-full h-52 sm:h-60 flex justify-center items-center">
                        <canvas id="grafikKategori"></canvas>
                    </div>
                </section>

                <!-- Riwayat -->
                <section class="ios-card p-5">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-xs flex items-center gap-2">
                            <i class="fa-solid fa-clock-rotate-left text-[#FF9500]"></i> Riwayat Transaksi Online
                        </h3>
                        <button onclick="resetSemuaData()" class="text-[11px] text-[#FF3B30] font-semibold hover:opacity-80 transition cursor-pointer">Reset Semua</button>
                    </div>
                    <div id="list-transaksi" class="space-y-2 max-h-[460px] overflow-y-auto pr-1">
                        <p id="empty-state" class="text-center text-[var(--text-muted)] text-xs py-8">Memuat data dari cloud...</p>
                    </div>
                </section>
            </div>

        </div>
    </div>

    <!-- Template Form -->
    <template id="template-form">
        <form onsubmit="submitTransaksi(event)" class="flex flex-col gap-2.5">
            <div class="grid grid-cols-2 gap-1 ios-inner-box p-1 rounded-xl">
                <button type="button" id="btn-pemasukan" onclick="setTipe('pemasukan')" class="py-1.5 rounded-lg text-xs font-bold text-[var(--text-muted)] transition cursor-pointer">Masuk</button>
                <button type="button" id="btn-pengeluaran" onclick="setTipe('pengeluaran')" class="py-1.5 rounded-lg text-xs font-bold bg-[#007AFF] text-white shadow-sm transition cursor-pointer">Keluar</button>
            </div>
            <div>
                <input type="text" id="keterangan" placeholder="Keterangan (Cth: Belanja Bulanan)" required class="w-full px-3.5 py-2 ios-input text-xs font-medium">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <div>
                    <input type="text" id="nominal" inputmode="numeric" placeholder="Nominal (Rp)" required class="w-full px-3.5 py-2 ios-input text-xs font-medium">
                </div>
                <div>
                    <select id="kategori" class="w-full px-3.5 py-2 ios-input text-xs font-medium cursor-pointer">
                    </select>
                </div>
            </div>
            <button type="submit" id="btn-simpan" class="w-full bg-[#007AFF] text-white font-bold py-2.5 rounded-xl shadow-md shadow-blue-500/20 hover:opacity-90 transition text-xs mt-1 cursor-pointer">SIMPAN</button>
        </form>
    </template>

    <!-- Skrip Supabase & Logika Aplikasi -->
    <script>
        // ==========================================
        // KONFIGURASI SUPABASE (MASUKKAN KUNCI ANDA DI SINI)
        // ==========================================
        const SUPABASE_URL = 'https://npafjuaecwexkfvutlwj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_foViRxthdk85P9UVhk4cmA_XmUGyToR';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Toggle Tema Manual
        function initTheme() {
            const savedTheme = localStorage.getItem('dompetku_theme');
            const iconEl = document.getElementById('theme-icon');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
                iconEl.className = "fa-solid fa-sun";
            } else {
                document.documentElement.classList.remove('dark');
                iconEl.className = "fa-solid fa-moon";
            }
        }

        function toggleDarkMode() {
            const htmlEl = document.documentElement;
            const iconEl = document.getElementById('theme-icon');
            if (htmlEl.classList.contains('dark')) {
                htmlEl.classList.remove('dark');
                localStorage.setItem('dompetku_theme', 'light');
                iconEl.className = "fa-solid fa-moon";
            } else {
                htmlEl.classList.add('dark');
                localStorage.setItem('dompetku_theme', 'dark');
                iconEl.className = "fa-solid fa-sun";
            }
            if (myChart) updateGrafik();
        }

        let tipeAktif = 'pengeluaran';
        let transaksiList = [];
        let myChart = null;

        function initForm() {
            const template = document.getElementById('template-form').content;
            document.getElementById('form-container').appendChild(template.cloneNode(true));
            setupNominalListener();
            updatePilihanKategori();
        }

        function setupNominalListener() {
            document.querySelectorAll('#nominal').forEach(input => {
                input.addEventListener('input', function() {
                    let value = this.value.replace(/[^,\d]/g, '').toString();
                    let split = value.split(',');
                    let sisa = split[0].length % 3;
                    let rupiah = split[0].substr(0, sisa);
                    let ribuan = split[0].substr(sisa).match(/\d{3}/gi);
                    if (ribuan) {
                        rupiah += (sisa ? '.' : '') + ribuan.join('.');
                    }
                    rupiah = split[1] !== undefined ? rupiah + ',' + split[1] : rupiah;
                    document.querySelectorAll('#nominal').forEach(inp => inp.value = rupiah);
                });
            });
        }

        const ikonKategori = {
            'Gaji': 'fa-sack-dollar',
            'Makanan/Minuman': 'fa-utensils',
            'Tagihan': 'fa-bolt',
            'Transport': 'fa-car',
            'Belanja': 'fa-bag-shopping',
            'Hiburan': 'fa-gamepad',
            'Lainnya': 'fa-box-archive'
        };

        const daftarKategori = {
            pemasukan: [
                { value: 'Gaji', label: 'Gaji / Pemasukan Utama' },
                { value: 'Lainnya', label: 'Pemasukan Lainnya' }
            ],
            pengeluaran: [
                { value: 'Makanan/Minuman', label: 'Makanan & Minuman (Needs)' },
                { value: 'Tagihan', label: 'Tagihan & Utilitas (Needs)' },
                { value: 'Transport', label: 'Transportasi (Needs)' },
                { value: 'Belanja', label: 'Belanja & Barang (Wants)' },
                { value: 'Hiburan', label: 'Hiburan & Lifestyle (Wants)' },
                { value: 'Lainnya', label: 'Pengeluaran Lainnya (Wants)' }
            ]
        };

        function updatePilihanKategori() {
            document.querySelectorAll('#kategori').forEach(select => {
                select.innerHTML = '';
                daftarKategori[tipeAktif].forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.value;
                    opt.textContent = item.label;
                    select.appendChild(opt);
                });
            });
        }

        function setTipe(tipe) {
            tipeAktif = tipe;
            const btnMasuk = document.getElementById('btn-pemasukan');
            const btnKeluar = document.getElementById('btn-pengeluaran');

            if (tipe === 'pemasukan') {
                btnMasuk.className = "py-1.5 rounded-lg text-xs font-bold bg-[#34C759] text-white shadow-sm transition cursor-pointer";
                btnKeluar.className = "py-1.5 rounded-lg text-xs font-bold text-[var(--text-muted)] transition bg-transparent cursor-pointer";
            } else {
                btnKeluar.className = "py-1.5 rounded-lg text-xs font-bold bg-[#007AFF] text-white shadow-sm transition cursor-pointer";
                btnMasuk.className = "py-1.5 rounded-lg text-xs font-bold text-[var(--text-muted)] transition bg-transparent cursor-pointer";
            }
            updatePilihanKategori();
        }

        // --- AMBIL DATA DARI SUPABASE ---
        async function ambilDataCloud() {
            const statusEl = document.getElementById('sync-status');
            try {
                const { data, error } = await _supabase
                    .from('transaksi')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                transaksiList = data || [];
                renderAplikasi();
                
                statusEl.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Online`;
                statusEl.className = "text-[10px] px-2.5 py-1 rounded-full font-bold bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 flex items-center gap-1.5";
            } catch (err) {
                console.error("Gagal memuat:", err.message);
                statusEl.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span> Error Koneksi`;
                statusEl.className = "text-[10px] px-2.5 py-1 rounded-full font-bold bg-rose-500/10 text-rose-500 border border-rose-500/20 flex items-center gap-1.5";
            }
        }

        // --- SIMPAN TRANSAKSI KE SUPABASE ---
        async function submitTransaksi(e) {
            e.preventDefault();
            const btnSimpan = document.getElementById('btn-simpan');
            btnSimpan.disabled = true;
            btnSimpan.innerText = "Menyimpan ke Cloud...";

            const keterangan = document.getElementById('keterangan').value;
            const nominal = parseFloat(document.getElementById('nominal').value.replace(/\./g, ''));
            const kategori = document.getElementById('kategori').value;

            const transaksiBaru = {
                id: Date.now(),
                tipe: tipeAktif,
                keterangan,
                nominal,
                kategori,
                tanggal: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })
            };

            try {
                const { error } = await _supabase.from('transaksi').insert([transaksiBaru]);
                if (error) throw error;

                document.querySelectorAll('#keterangan').forEach(i => i.value = '');
                document.querySelectorAll('#nominal').forEach(i => i.value = '');
                setTipe('pengeluaran');
            } catch (err) {
                alert('Gagal menyimpan transaksi: ' + err.message);
            } finally {
                btnSimpan.disabled = false;
                btnSimpan.innerText = "SIMPAN";
            }
        }

        // --- HAPUS TRANSAKSI DARI SUPABASE ---
        async function hapusTransaksi(id) {
            if (!confirm("Hapus transaksi ini dari dompet bersama?")) return;
            try {
                const { error } = await _supabase.from('transaksi').delete().eq('id', id);
                if (error) throw error;
            } catch (err) {
                alert('Gagal menghapus: ' + err.message);
            }
        }

        // --- RESET SEMUA DATA DI SUPABASE ---
        async function resetSemuaData() {
            if (confirm("PERINGATAN: Menghapus SELURUH riwayat transaksi bersama?")) {
                try {
                    const { error } = await _supabase.from('transaksi').delete().neq('id', 0);
                    if (error) throw error;
                } catch (err) {
                    alert('Gagal mereset: ' + err.message);
                }
            }
        }

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        function updateGrafik() {
            const ctx = document.getElementById('grafikKategori').getContext('2d');
            const dataKategori = { 'Makanan/Minuman': 0, 'Transport': 0, 'Belanja': 0, 'Tagihan': 0, 'Hiburan': 0, 'Lainnya': 0 };

            transaksiList.filter(t => t.tipe === 'pengeluaran').forEach(t => {
                if (dataKategori[t.kategori] !== undefined) dataKategori[t.kategori] += t.nominal;
            });

            if (myChart) myChart.destroy();

            const isDark = document.documentElement.classList.contains('dark');

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(dataKategori),
                    datasets: [{
                        data: Object.values(dataKategori),
                        backgroundColor: ['#007AFF', '#34C759', '#FF9500', '#FF3B30', '#5856D6', '#8E8E93'],
                        borderWidth: 2,
                        borderColor: isDark ? '#1E1E22' : '#FFFFFF',
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                boxWidth: 8,
                                font: { size: 10, family: 'Plus Jakarta Sans', weight: '600' },
                                color: isDark ? '#A1A1AA' : '#8E8E93'
                            }
                        }
                    }
                }
            });
        }

        function updateBudgeting503020(totalPemasukan) {
            let totalNeeds = 0, totalWants = 0;
            const needsCat = ['Makanan/Minuman', 'Tagihan', 'Transport'];

            transaksiList.filter(t => t.tipe === 'pengeluaran').forEach(t => {
                if (needsCat.includes(t.kategori)) totalNeeds += t.nominal;
                else totalWants += t.nominal;
            });

            const idealNeeds = totalPemasukan * 0.50;
            const idealWants = totalPemasukan * 0.30;
            const idealSavings = totalPemasukan * 0.20;

            let pctNeeds = idealNeeds > 0 ? Math.min((totalNeeds / idealNeeds) * 100, 100) : 0;
            let pctWants = idealWants > 0 ? Math.min((totalWants / idealWants) * 100, 100) : 0;

            document.getElementById('info-needs').innerText = `${formatRupiah(totalNeeds)} / ${formatRupiah(idealNeeds)}`;
            document.getElementById('bar-needs').style.width = `${pctNeeds}%`;
            document.getElementById('bar-needs').className = totalNeeds > idealNeeds ? "bg-[#FF3B30] h-full rounded-full transition-all" : "bg-[#007AFF] h-full rounded-full transition-all";

            document.getElementById('info-wants').innerText = `${formatRupiah(totalWants)} / ${formatRupiah(idealWants)}`;
            document.getElementById('bar-wants').style.width = `${pctWants}%`;
            document.getElementById('bar-wants').className = totalWants > idealWants ? "bg-[#FF3B30] h-full rounded-full transition-all" : "bg-[#5856D6] h-full rounded-full transition-all";

            document.getElementById('info-savings').innerText = formatRupiah(idealSavings);
        }

        function renderAplikasi() {
            let totalPemasukan = 0, totalPengeluaran = 0;
            const listEl = document.getElementById('list-transaksi');
            listEl.innerHTML = '';

            if (transaksiList.length === 0) {
                listEl.innerHTML = `<p class="text-center text-[var(--text-muted)] text-xs py-8">Belum ada transaksi online.</p>`;
            } else {
                transaksiList.forEach(t => {
                    if (t.tipe === 'pemasukan') totalPemasukan += t.nominal;
                    else totalPengeluaran += t.nominal;

                    const itemEl = document.createElement('div');
                    itemEl.className = "flex justify-between items-center p-3 ios-inner-box rounded-xl transition";
                    itemEl.innerHTML = `
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-lg flex items-center justify-center ${t.tipe === 'pemasukan' ? 'bg-[#34C759]/15 text-[#34C759]' : 'bg-[#007AFF]/15 text-[#007AFF]'}">
                                <i class="fa-solid ${ikonKategori[t.kategori] || 'fa-circle'} text-xs"></i>
                            </div>
                            <div>
                                <p class="font-bold text-xs">${t.keterangan}</p>
                                <p class="text-[10px] text-[var(--text-muted)] font-medium">${t.kategori} • ${t.tanggal}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-xs ${t.tipe === 'pemasukan' ? 'text-[#34C759]' : 'text-[var(--text-main)]'}">
                                ${t.tipe === 'pemasukan' ? '+' : '-'} ${formatRupiah(t.nominal)}
                            </span>
                            <button onclick="hapusTransaksi(${t.id})" class="text-[var(--text-muted)] hover:text-[#FF3B30] text-xs cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    `;
                    listEl.appendChild(itemEl);
                });
            }

            document.getElementById('total-pemasukan').innerText = formatRupiah(totalPemasukan);
            document.getElementById('total-pengeluaran').innerText = formatRupiah(totalPengeluaran);
            document.getElementById('total-saldo').innerText = formatRupiah(totalPemasukan - totalPengeluaran);

            updateGrafik();
            updateBudgeting503020(totalPemasukan);
        }

        // --- REAL-TIME LISTENER (SUPABASE) ---
        function setupRealtimeSync() {
            _supabase
                .channel('public:transaksi')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'transaksi' }, payload => {
                    ambilDataCloud(); // Otomatis refresh data di HP Anda & Istri saat ada perubahan
                })
                .subscribe();
        }

        // Inisialisasi Awal
        initTheme();
        initForm();
        setTipe('pengeluaran');
        ambilDataCloud();
        setupRealtimeSync();
    </script>
</body>
</html>
